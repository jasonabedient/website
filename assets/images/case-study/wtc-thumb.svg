<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05090e"/>
      <stop offset="50%" stop-color="#09131c"/>
      <stop offset="100%" stop-color="#060d13"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="48%" r="52%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00b8d4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00b8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="22%" cy="25%" r="45%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardSurface" x1="620" y1="80" x2="1500" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1822"/>
      <stop offset="100%" stop-color="#081017"/>
    </linearGradient>
    <linearGradient id="estimateSurface" x1="680" y1="470" x2="1460" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a222c"/>
      <stop offset="100%" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#1e3a4c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="cardPop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>
  <rect width="1600" height="900" fill="url(#emeraldGlow)"/>

  <!-- LEFT EDITORIAL COLUMN -->
  <g transform="translate(88, 128)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="246" height="38" rx="19" fill="#0b2530" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="19" r="5" fill="#00e5ff"/>
    <text x="38" y="24" fill="#67e8f9" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">WHATSTHECHARGE.COM</text>

    <!-- Main Title -->
    <text x="0" y="114" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2">What's The</text>
    <text x="0" y="190" fill="url(#cyanAccent)" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2">Charge?</text>

    <!-- Subtitle -->
    <text x="0" y="246" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="400">
      <tspan x="0" dy="0">Zero-friction EV charging cost calculator</tspan>
      <tspan x="0" dy="32">with instant geolocation &amp; utility rate lookup.</tspan>
    </text>

    <!-- Auto-Detected Context Stack -->
    <g transform="translate(0, 326)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="390" height="58" rx="12" fill="#0c1924" stroke="#1e3446" stroke-width="1.2"/>
      <rect x="14" y="13" width="32" height="32" rx="8" fill="#0c2d3a"/>
      <text x="30" y="35" text-anchor="middle" fill="#00e5ff" font-family="Inter, sans-serif" font-size="16" font-weight="700">📍</text>
      <text x="60" y="26" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">AUTO-DETECTED UTILITY RATE</text>
      <text x="60" y="45" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">California · Standard ($0.320/kWh)</text>
      <rect x="318" y="17" width="56" height="24" rx="12" fill="#06342b"/>
      <text x="346" y="33" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">LIVE</text>

      <!-- Pill 2 -->
      <rect x="0" y="72" width="390" height="58" rx="12" fill="#0c1924" stroke="#1e3446" stroke-width="1.2"/>
      <rect x="14" y="85" width="32" height="32" rx="8" fill="#0c2d3a"/>
      <text x="30" y="107" text-anchor="middle" fill="#00e5ff" font-family="Inter, sans-serif" font-size="16" font-weight="700">🚗</text>
      <text x="60" y="98" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">VEHICLE SPEC MATCHED</text>
      <text x="60" y="117" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">2025 Rivian R1S · Dual Max (140 kWh)</text>
    </g>

    <!-- Bottom Speed / Impact Metrics -->
    <g transform="translate(0, 514)">
      <g>
        <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">&lt;10s</text>
        <text x="0" y="58" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">TIME TO RESULT</text>
      </g>
      <line x1="128" y1="8" x2="128" y2="62" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(154, 0)">
        <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">50+</text>
        <text x="0" y="58" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">STATE TARRIFFS</text>
      </g>
      <line x1="274" y1="8" x2="274" y2="62" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(300, 0)">
        <text x="0" y="34" fill="#00e5ff" font-family="Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">100%</text>
        <text x="0" y="58" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">NO LOGIN NEEDED</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PRODUCT UI SHOWCASE -->
  <g transform="translate(560, 74)" filter="url(#dropShadow)">
    <!-- Main App Window -->
    <rect x="0" y="0" width="952" height="752" rx="22" fill="url(#cardSurface)" stroke="url(#borderGlow)" stroke-width="1.5"/>

    <!-- Window Top Bar -->
    <path d="M 0 22 C 0 9.85 9.85 0 22 0 L 930 0 C 942.15 0 952 9.85 952 22 L 952 54 L 0 54 Z" fill="#0b151e"/>
    <line x1="0" y1="54" x2="952" y2="54" stroke="#182a38" stroke-width="1"/>
    <circle cx="28" cy="27" r="6" fill="#ff5f57" fill-opacity="0.85"/>
    <circle cx="48" cy="27" r="6" fill="#febc2e" fill-opacity="0.85"/>
    <circle cx="68" cy="27" r="6" fill="#28c840" fill-opacity="0.85"/>
    <rect x="346" y="13" width="260" height="28" rx="6" fill="#070e14" stroke="#162634" stroke-width="1"/>
    <text x="476" y="31" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="500">⚡ whatsthecharge.com</text>

    <!-- App Header -->
    <g transform="translate(44, 86)">
      <rect x="0" y="0" width="34" height="34" rx="9" fill="#072935" stroke="#00e5ff" stroke-opacity="0.4"/>
      <path d="M19 9L11 20H17L15 27L23 16H17L19 9Z" fill="#00e5ff"/>
      <text x="48" y="24" fill="#f8fafc" font-family="Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4">Charging Cost Calculator</text>
      <rect x="720" y="2" width="144" height="30" rx="15" fill="#072935"/>
      <text x="792" y="21" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="12" font-weight="600">Level 2 · 11.5 kW</text>
    </g>

    <!-- 4-Column Vehicle Selector Row -->
    <g transform="translate(44, 146)">
      <g>
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">YEAR</text>
        <rect x="0" y="24" width="198" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">2025</text>
        <path d="M170 44L175 49L180 44" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g transform="translate(218, 0)">
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MAKE</text>
        <rect x="0" y="24" width="198" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">Rivian</text>
        <path d="M170 44L175 49L180 44" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g transform="translate(436, 0)">
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MODEL</text>
        <rect x="0" y="24" width="198" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">R1S</text>
        <path d="M170 44L175 49L180 44" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g transform="translate(654, 0)">
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TRIM</text>
        <rect x="0" y="24" width="210" height="46" rx="10" fill="#111d28" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="600">Dual Max AWD</text>
        <path d="M182 44L187 49L192 44" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Battery Detected Banner + Charge Window -->
    <g transform="translate(44, 238)">
      <rect x="0" y="0" width="864" height="84" rx="14" fill="#082430" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.2"/>
      <!-- Battery Icon -->
      <rect x="24" y="27" width="36" height="22" rx="4" stroke="#00e5ff" stroke-width="2.2"/>
      <rect x="29" y="32" width="20" height="12" rx="2" fill="#00e5ff"/>
      <rect x="62" y="33" width="3.5" height="10" rx="1.5" fill="#00e5ff"/>

      <text x="82" y="33" fill="#67e8f9" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">BATTERY DETECTED (USABLE CAPACITY)</text>
      <text x="82" y="62" fill="#ffffff" font-family="Inter, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">135.0 kWh</text>

      <!-- Charge Range Visual Progress inside Banner -->
      <g transform="translate(440, 18)">
        <text x="0" y="14" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="600">CHARGE WINDOW: <tspan fill="#ffffff">20% → 85%</tspan></text>
        <text x="396" y="14" text-anchor="end" fill="#00e5ff" font-family="Inter, sans-serif" font-size="12" font-weight="700">+65% (+87.8 kWh)</text>
        <rect x="0" y="26" width="396" height="14" rx="7" fill="#06151d"/>
        <rect x="0" y="26" width="79" height="14" rx="7" fill="#334155"/>
        <rect x="72" y="26" width="264" height="14" rx="7" fill="url(#cyanAccent)"/>
      </g>
    </g>

    <!-- Rate & Charger Row -->
    <g transform="translate(44, 344)">
      <g>
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CHARGER OUTPUT</text>
        <rect x="0" y="24" width="274" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="600">11.5 kW (Level 2 — 48A)</text>
      </g>
      <g transform="translate(294, 0)">
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STATE &amp; UTILITY PLAN</text>
        <rect x="0" y="24" width="274" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="600">California · Off-Peak EV</text>
      </g>
      <g transform="translate(588, 0)">
        <text x="0" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ELECTRICITY RATE ($/KWH)</text>
        <rect x="0" y="24" width="276" height="46" rx="10" fill="#111d28" stroke="#22374a" stroke-width="1.2"/>
        <text x="16" y="52" fill="#00e5ff" font-family="Inter, sans-serif" font-size="15" font-weight="700">$0.240 / kWh</text>
        <text x="260" y="51" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="500">Auto-filled</text>
      </g>
    </g>

    <!-- ELEVATED HERO ESTIMATE CARD -->
    <g transform="translate(44, 442)" filter="url(#cardPop)">
      <rect x="0" y="0" width="864" height="266" rx="18" fill="url(#estimateSurface)" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.5"/>

      <!-- Header inside Estimate Card -->
      <text x="32" y="38" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">CHARGING ESTIMATE &amp; SAVINGS BREAKDOWN</text>
      <rect x="654" y="18" width="178" height="28" rx="14" fill="#06392f" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="743" y="36" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">Saves $38.40 vs. Gas</text>

      <!-- 3 Metric Columns -->
      <!-- Metric 1: Energy -->
      <g transform="translate(32, 66)">
        <rect x="0" y="0" width="252" height="168" rx="14" fill="#06131a" fill-opacity="0.65" stroke="#163547" stroke-width="1"/>
        <rect x="20" y="20" width="42" height="42" rx="10" fill="#092c3a"/>
        <path d="M43 29L33 43H41L39 53L49 39H41L43 29Z" fill="#00e5ff"/>
        <text x="20" y="108" fill="#00e5ff" font-family="Inter, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.2">87.8</text>
        <text x="118" y="108" fill="#67e8f9" font-family="Inter, sans-serif" font-size="20" font-weight="700">kWh</text>
        <text x="20" y="138" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ENERGY NEEDED</text>
      </g>

      <!-- Metric 2: Time -->
      <g transform="translate(306, 66)">
        <rect x="0" y="0" width="252" height="168" rx="14" fill="#06131a" fill-opacity="0.65" stroke="#163547" stroke-width="1"/>
        <rect x="20" y="20" width="42" height="42" rx="10" fill="#092c3a"/>
        <circle cx="41" cy="41" r="11" stroke="#00e5ff" stroke-width="2.2"/>
        <path d="M41 35V41L45 44" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round"/>
        <text x="20" y="108" fill="#ffffff" font-family="Inter, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.2">7.6</text>
        <text x="92" y="108" fill="#94a3b8" font-family="Inter, sans-serif" font-size="20" font-weight="700">hrs</text>
        <text x="20" y="138" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CHARGING TIME</text>
      </g>

      <!-- Metric 3: Est Cost -->
      <g transform="translate(580, 66)">
        <rect x="0" y="0" width="252" height="168" rx="14" fill="#082836" stroke="#00e5ff" stroke-opacity="0.45" stroke-width="1.2"/>
        <rect x="20" y="20" width="42" height="42" rx="10" fill="#0c3b4e"/>
        <text x="41" y="48" text-anchor="middle" fill="#00e5ff" font-family="Inter, sans-serif" font-size="22" font-weight="800">$</text>
        <text x="20" y="108" fill="#00e5ff" font-family="Inter, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.2">$21.07</text>
        <text x="20" y="138" fill="#67e8f9" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1">EST. SESSION COST</text>
      </g>
    </g>
  </g>
</svg>
